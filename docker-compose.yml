version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ski-school-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/data.db
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,https://www.ski-school-vershina.ru,https://ski-school-vershina.ru
      - ENVIRONMENT=production
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    networks:
      - ski-school-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: ski-school-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ski-school-network

volumes:
  backend-data:
    driver: local

networks:
  ski-school-network:
    driver: bridge
