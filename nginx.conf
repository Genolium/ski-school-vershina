# Примечание: Для работы proxy_cache необходимо добавить в основной nginx.conf (в блоке http):
# proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name localhost vershinaski.ru;
    
    # Redirect HTTP to HTTPS (uncomment when SSL is configured)
    # return 301 https://$server_name$request_uri;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
    gzip_proxied any;
    gzip_comp_level 6;

    # Brotli compression (if available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Maximum upload size (for file uploads)
    client_max_body_size 25M;

    # Статические ресурсы с хешами (JS, CSS) - долгое кэширование
    location ~* ^/assets/(js|css)/.+\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Изображения - долгое кэширование
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        # Оптимизация доставки изображений
        add_header Vary "Accept-Encoding";
    }

    # Шрифты - долгое кэширование
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        add_header Access-Control-Allow-Origin "*";
    }

    # Favicon и манифесты - среднее кэширование
    location ~* ^/(favicon|robots\.txt|sitemap\.xml|site\.webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML файлы - без кэширования или очень короткое (для SPA обновлений)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Proxy uploads to backend (должен быть ДО location / для правильного матчинга)
    location /uploads {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache uploaded files - долгое кэширование, так как пути уникальны
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to backend
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Кэширование для GET запросов к публичным API
        # Используется браузерное кэширование через Cache-Control заголовки из бэкенда
        # Для nginx proxy_cache раскомментируйте следующие строки после настройки proxy_cache_path:
        # proxy_cache api_cache;
        # proxy_cache_methods GET HEAD;
        # proxy_cache_valid 200 10m;
        # proxy_cache_valid 404 1m;
        # proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # proxy_cache_background_update on;
        
        # Increase timeouts for POST requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable buffering for better streaming
        proxy_buffering off;
        
        # Pass through backend errors
        proxy_intercept_errors off;
    }

    # SPA routing (должен быть последним, чтобы не перехватывать /uploads и /api)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Для index.html - короткое кэширование
        if ($uri = /index.html) {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }
    }




    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://mc.yandex.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: https://mc.yandex.ru; connect-src 'self' ws: wss: https://mc.yandex.ru; frame-src 'self' https://makemap.2gis.ru https://2gis.ru; frame-ancestors 'self';" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
